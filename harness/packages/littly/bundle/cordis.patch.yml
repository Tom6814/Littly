# @littly/bundle — Littly 业务插件装配层。
# 服务器面（无 GUI）：webserver + connection + Typert Remote 控制器 + 定时任务，
# 从 web-app bundle 提取但去掉 webStartup / web 前端依赖；业务插件的行加在下面。
- insert:
    # 业务存储（SQLite，业务 schema）
    # file 走 LITTLY_DB_FILE：容器里必须落在持久卷上（默认 data/littly.db 是相对 cwd 的，
    # 会落在 /app/harness/data 而不是挂载卷，容器重建即丢库）。
    - id: littly-storage
      name: '@littly/storage'
      config:
        file: !!js process.env.LITTLY_DB_FILE || 'data/littly.db'

    # 分层提示词组装（人格核心）
    - id: littly-persona
      name: '@littly/persona'

    # OpenAI 兼容 LLM 通道（配置链 DB KV→env→默认）
    - id: littly-llm
      name: '@littly/llm'

    # 记忆引擎
    - id: littly-memory
      name: '@littly/memory'

    # 人格成长系统（潜意识评审 / 事实审计 / 对抗质询 / 提议-审批）
    - id: littly-growth
      name: '@littly/growth'

    # bilibili：CLI 壳（bilibili-cli；模型只走带护栏的 bili 元工具）
    - id: littly-channel-discord
      name: '@littly/channel-discord'
    - id: littly-channel-wechat-ilink
      name: '@littly/channel-wechat-ilink'
    - id: littly-voice-call
      name: '@littly/voice-call'




    - id: littly-bili
      name: '@littly/bili'

    # 运行时 MCP 服务器管理（控制台可加/删 MCP 服务器）
    - id: littly-mcp
      name: '@littly/mcp'

    # 对话主链路 + 缓冲窗口 + 渠道投递
    - id: littly-agents
      name: '@littly/agents'
    # @littly/voice 是库模块（无 apply），由 @littly/agents 直接引用，不作为插件行装配
    # X（Twitter）：她自己的账号（twitter-cli）。写操作默认预演，开关由控制台控制。
    - id: littly-x
      name: '@littly/x'
    - id: littly-console-api
      name: '@littly/console-api'
    - id: littly-scheduler
      name: '@littly/scheduler'
    - id: littly-channel-telegram
      name: '@littly/channel-telegram'
    # 邮箱：给 AI 绑定邮箱后的 IMAP/SMTP 收发能力（写默认预演，密码不回传）
    - id: littly-mail
      name: '@littly/mail'
    # SnowLuma 一键安装/配置（docker pull/run + noVNC 扫码信息 + token 自动接线）
    - id: littly-snowluma
      name: '@littly/snowluma'
    # QQ 双渠道：SnowLuma OneBot v11 + 官方 QQBot（基于 MIT dsh-lane-bridge 重写）
    - id: littly-channel-qq
      name: '@littly/channel-qq'


    # HTTP 载体：dsh 拒绝 0.0.0.0 通配（容器语义由编排层解析本机 IP 注入，
    # 见 deploy/entrypoint.sh 的 hostname -i）；本地开发回落 127.0.0.1
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: !!js process.env.DSH_WEB_HOST || '127.0.0.1'
        port: !!js Number(process.env.PORT) || 3000
        compression: gzip
        compressionLevel: 1
        compressionThresholdBytes: 1024

    # 浏览器会话认证 + /api RPC 桥（无 webStartup，信任主机走默认回环/监听绑定策略）
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
      config:
        trustedHosts: []

    # Typert Remote 控制器：会话读写 / 后台任务 / 配置面
    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'
    - id: job-controller
      name: '@deepseek-ai/dsh-api-job-controller'
    - id: settings-controller
      name: '@deepseek-ai/dsh-api-settings-controller'

    # 定时任务服务（dsh 原生：cron → agent.followup），Littly 调度器底座
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

    # bilibili 能力由 @littly/bili 直接 spawn `bili`（CLI 壳），没有 MCP 服务器；
    # 旧的 mcp-bili（stdio `bili mcp serve`）随 bili-agent 一起下线（见 docs/BILI-INTEGRATION.md）。
