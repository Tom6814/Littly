# Littly 单机编排：harness 核心 + SnowLuma（QQ 账号协议端）。
# 说明：
# - littly：dsh-base 内核 chat profile，SQLite 落持久卷；先单独可跑。
# - snowluma：需 SYS_PTRACE 注入 NTQQ，官方 Docker 镜像内含 QQ+Xvfb+noVNC（见 docs/SNOWLUMA-CONTRACT.md §1）。
#   镜像名/版本以 SnowLuma Releases 为准（早期项目迭代快，锁 tag），首次启用需 noVNC(6081) 扫码。
# - bilibili 不再有独立 sidecar：`@littly/bili` 直接 spawn 容器内的 `bili`（bilibili-cli，Python），
#   控制台扫码/浏览器 Cookie 认证 + 命令执行都在 harness 进程内完成（/api/bili/*）。
#   B 站账号状态（credential.json）落在持久卷 bili-data：BILI_CLI_HOME 被解释为 bili CLI 的 HOME。
services:
  littly:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # 显式给镜像名：构建一次，`compose up` 直接复用已构建好的镜像（`--no-build` 可完全跳过构建）
    image: littly-harness:test
    container_name: littly-harness
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      TZ: Asia/Shanghai
      DSH_HOME: /app/data/dsh-home
      # 业务库落在持久卷（容器重建不丢库）
      LITTLY_DB_FILE: /app/data/littly.db
      # B11：上传/生成文件（相册/文档/语音/头像）与 SQLite 同卷，重建容器不丢
      LITTLY_DATA_DIR: /app/data
      # bilibili-cli：BILI_CLI_HOME 是 bili CLI 的 HOME（凭证落 <HOME>/.bilibili-cli/credential.json）
      BILI_CLI_HOME: /app/bili-data
      BILI_BIN: bili
      # 密钥经 env 注入（勿写进镜像）；模型配置也可后续在 DB KV 里配
      # OPENAI_API_KEY / OPENAI_BASE_URL / OPENAI_CHAT_MODEL ...
    volumes:
      - littly-data:/app/data
      # bilibili-cli 的 HOME（credential.json 随卷持久化，容器重建不丢登录态）
      - bili-data:/app/bili-data

  snowluma:
    image: ghcr.io/snowluma/snowluma:latest  # TODO(M2): 锁定具体 tag
    container_name: littly-snowluma
    restart: unless-stopped
    profiles: ["qq"]
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    shm_size: "2gb"
    environment:
      TZ: Asia/Shanghai
    ports:
      - "3001:3001"   # OneBot 正向 WS（littly 连这里）
      - "5099:5099"   # WebUI（初始密码仅首启日志打印一次）
      - "6081:6081"   # noVNC 扫码登录（勿暴露公网）
    volumes:
      - snowluma-data:/app/data

volumes:
  littly-data:
  snowluma-data:
  bili-data:
